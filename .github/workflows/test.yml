# Lazarus CI — runs the test suite on macos-latest. Apple Vision
# is the face-comparison backend; Linux / Windows are out of
# scope per README §Limitations. As of v0.1.11, every LZ-NNN
# entry (LZ-001..LZ-015, 15/15) is :tested and exercised here:
#
#   LZ-001 (visual-skin/security decoupling)    → test_visual_skin_decoupling.py
#   LZ-002 (face-match distance bands)          → test_distance_band_thresholds.py
#   LZ-003 (shakespeare-mode companion refusal) → test_shakespeare_mode_refusal.py
#   LZ-004 (--auth clears shakespeare)          → test_auth_clears_shakespeare.py
#   LZ-005 (apple-vision local-only)            → test_no_networking_imports.sh
#   LZ-006 (reference-storage bounded)          → test_reference_bounds.py
#   LZ-007 (watch-loop state transitions)       → test_watch_state_transitions.py
#   LZ-008 (--peek JSON output shape)           → test_peek_output.py
#   LZ-009 (network-monitor classification)     → test_network_monitor_classify.py
#   LZ-010 (network-honeypot port listeners)    → test_honeypot_listener.py
#   LZ-011 (oversight Tier 1 forensic logger)   → test_oversight_action.sh
#   LZ-012 (companion read-only discipline)     → test_companion_readonly_discipline.py
#   LZ-013 (anti-spoof liveness probe)          → test_liveness_check.py
#   LZ-014 (leave-one-out pool quality scoring) → test_prune_logic.py
#   LZ-015 (Touch ID opportunistic pre-face)    → test_touchid_check.py
#
# The face_compare Swift binary is built as a sanity check; the
# tests stub it out via module-level patching or the
# FACE_COMPARE_STUB env-var shim (added v0.1.5).

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build face_compare (sanity check)
        run: |
          swiftc -O \
            -framework Vision \
            -framework AppKit \
            face_compare.swift \
            -o face_compare
          file face_compare
          file face_compare | grep -q "Mach-O"

      - name: LZ-011 — test_oversight_action.sh
        run: bash test/test_oversight_action.sh

      - name: LZ-009 — test_network_monitor_classify.py
        run: python3 test/test_network_monitor_classify.py

      - name: LZ-013 — test_liveness_check.py
        run: python3 test/test_liveness_check.py

      - name: LZ-014 — test_prune_logic.py
        run: python3 test/test_prune_logic.py

      - name: LZ-015 — test_touchid_check.py
        run: python3 test/test_touchid_check.py

      - name: LZ-006 — test_reference_bounds.py
        run: python3 test/test_reference_bounds.py

      - name: LZ-008 — test_peek_output.py
        run: python3 test/test_peek_output.py

      - name: LZ-007 — test_watch_state_transitions.py
        run: python3 test/test_watch_state_transitions.py

      - name: LZ-005 — test_no_networking_imports.sh
        run: bash test/test_no_networking_imports.sh

      - name: LZ-002 — test_distance_band_thresholds.py
        run: python3 test/test_distance_band_thresholds.py

      - name: LZ-001 — test_visual_skin_decoupling.py
        run: python3 test/test_visual_skin_decoupling.py

      - name: LZ-010 — test_honeypot_listener.py
        run: python3 test/test_honeypot_listener.py

      - name: LZ-003 — test_shakespeare_mode_refusal.py
        run: python3 test/test_shakespeare_mode_refusal.py

      - name: LZ-004 — test_auth_clears_shakespeare.py
        run: python3 test/test_auth_clears_shakespeare.py

      - name: LZ-012 — test_companion_readonly_discipline.py
        run: python3 test/test_companion_readonly_discipline.py

      - name: LZ-016 — Lean proof (Outliers.lean)
        working-directory: src/lean4
        run: |
          # Install elan so the toolchain pin in lean-toolchain
          # resolves to the matching Lean version.
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake build
